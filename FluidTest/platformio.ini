; PlatformIO Project Configuration File for FluidTest
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -Wall
board_build.f_cpu = 240000000L

; FastAccelStepper library dependency
lib_deps =
    ; Use the parent directory as the library source
    file://..

; Monitor configuration
monitor_speed = 115200
monitor_filters =
    direct  ; Do not buffer data
    time    ; Add timestamps

; Upload configuration (adjust upload_port to match your ESP32)
; upload_port = /dev/ttyUSB0  ; Linux
; upload_port = COM3          ; Windows
upload_speed = 921600
