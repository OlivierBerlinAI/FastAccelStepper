<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAccelStepper.js Demo</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: #252526;
            border-radius: 5px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3e3e42;
            cursor: not-allowed;
        }
        .status {
            margin: 20px 0;
            padding: 20px;
            background: #252526;
            border-radius: 5px;
            font-size: 14px;
        }
        .status-line {
            margin: 5px 0;
        }
        label {
            display: inline-block;
            width: 150px;
            color: #9cdcfe;
        }
        input[type="number"] {
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            padding: 5px;
            border-radius: 3px;
            width: 100px;
        }
        .visualization {
            margin: 20px 0;
            padding: 20px;
            background: #252526;
            border-radius: 5px;
            height: 200px;
            position: relative;
            overflow: hidden;
        }
        .stepper-visual {
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            background: #4ec9b0;
            border-radius: 50%;
            transform: translateY(-50%);
            transition: left 0.1s linear;
        }
        .center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #555;
        }
    </style>
</head>
<body>
    <h1>FastAccelStepper.js Demo</h1>

    <div class="controls">
        <h3>Configuration</h3>
        <div>
            <label>Max Speed (Hz):</label>
            <input type="number" id="speedInput" value="1000" min="1" max="10000">
        </div>
        <div>
            <label>Acceleration (steps/s²):</label>
            <input type="number" id="accelInput" value="500" min="1" max="5000">
        </div>
        <button onclick="updateConfig()">Apply Settings</button>
    </div>

    <div class="controls">
        <h3>Motion Control</h3>
        <button onclick="runForward()">Run Forward</button>
        <button onclick="runBackward()">Run Backward</button>
        <button onclick="stopMotor()">Stop</button>
        <button onclick="resetPosition()">Reset Position</button>
    </div>

    <div class="visualization">
        <div class="center-line"></div>
        <div class="stepper-visual" id="stepperVisual"></div>
    </div>

    <div class="status">
        <h3>Status</h3>
        <div class="status-line">
            <label>Position:</label>
            <span id="position">0</span> steps
        </div>
        <div class="status-line">
            <label>Speed:</label>
            <span id="speed">0.00</span> Hz
        </div>
        <div class="status-line">
            <label>Acceleration:</label>
            <span id="acceleration">0</span> steps/s²
        </div>
        <div class="status-line">
            <label>State:</label>
            <span id="state">IDLE</span>
        </div>
    </div>

    <script src="FastAccelStepper.js"></script>
    <script>
        // Create stepper instance
        const stepper = new FastAccelStepper();

        // Initialize with default values
        updateConfig();

        // Update status display
        function updateStatus() {
            const position = stepper.getCurrentPosition();
            const speedMilliHz = stepper.getCurrentSpeedInMilliHz();
            const speedHz = speedMilliHz / 1000;
            const accel = stepper.getCurrentAcceleration();
            const state = getStateString(stepper.getRampState());

            document.getElementById('position').textContent = position;
            document.getElementById('speed').textContent = speedHz.toFixed(2);
            document.getElementById('acceleration').textContent = accel.toFixed(0);
            document.getElementById('state').textContent = state;

            // Update visualization
            const visual = document.getElementById('stepperVisual');
            const container = visual.parentElement;
            const centerX = container.offsetWidth / 2;
            const scale = 0.1; // pixels per step
            const x = centerX + (position * scale);
            visual.style.left = x + 'px';
        }

        function getStateString(state) {
            const states = {
                0: 'IDLE',
                1: 'ACCELERATE',
                2: 'COAST',
                3: 'DECELERATE'
            };
            return states[state] || 'UNKNOWN';
        }

        function updateConfig() {
            const speed = parseInt(document.getElementById('speedInput').value);
            const accel = parseInt(document.getElementById('accelInput').value);

            stepper.setSpeedInHz(speed);
            stepper.setAcceleration(accel);

            console.log(`Updated: Speed=${speed} Hz, Accel=${accel} steps/s²`);
        }

        function runForward() {
            stepper.runForward();
            console.log('Running forward');
        }

        function runBackward() {
            stepper.runBackward();
            console.log('Running backward');
        }

        function stopMotor() {
            stepper.stopMove();
            console.log('Stopping');
        }

        function resetPosition() {
            // Stop first
            stepper.stopMove();
            // Wait for stop then reset (simple approach: create new instance)
            setTimeout(() => {
                location.reload();
            }, 100);
        }

        // Update display every 50ms
        setInterval(updateStatus, 50);
    </script>
</body>
</html>
